name: Inception
services:
  nginx:
    build: 
      context: .
      dockerfile: ${DIR_NGINX}/Dockerfile
      args: 
        PUBK_NAME: ${PUBK_NAME}
        PUBK_NGINX: ${PUBK_NGINX}
        NGINX_CONF: ${NGINX_CONF}
        NGINX_CONF_NAME: ${NGINX_CONF_NAME}
        DIRKEY: ${DIRKEY}
        DIRCRT: ${DIRCRT}
        CERT_NAME: ${CERT_NAME}
        CERT_: ${CERT_}
        NGINX_DIR_DFLT_CONF: ${NGINX_DIR_DFLT_CONF}
        NGINX_DOMAIN_NAME: ${NGINX_DOMAIN_NAME}
        NGINX_DIRKEY: ${DIRKEY}/${CERT_KEY_NAME}
      no_cache: true
      secrets:
        - nginx_key
    ports:
      - 443:443
    hostname: ${NGINX_HOST_NAME}
    domainname: ${NGINX_DOMAIN_NAME}
    profiles: [nginx, all]

  mariadb:
    build:
      context: .
      dockerfile: ${DIR_MARIADB}/Dockerfile
      no_cache: true
      args:
        MDB_CNF: ${MDB_CNF}
        MDB_SQL: ${MDB_SQL}
        DIR_MDB_CNF: ${DIR_MDB_CNF}
        DATADIR: ${DATADIR} 
        TOOL_CNF: ${TOOL_CNF}
        ADMN_USER: ${ADMN_USER}
        WDPRSS_USER: ${WDPRSS_USER}
      secrets:
        - mariadb_admin_key
        - mariadb_wdprss_key
    ports:
      - 3306:3306
    profiles: [mariadb, all]
    volumes:
      - db:${DATADIR}

networks:
  front-tier:

secrets:
  nginx_key:
    file: ${CERT_KEY}
  mariadb_admin_key:
    environment: "ADMN_KEY"
  mariadb_wdprss_key:
    environment: "WDPRSS_KEY"

volumes:
  db:
