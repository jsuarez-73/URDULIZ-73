include:
  - path:
    - ../../docker-compose.yml
    - override.yml
name: Bonus_inception
services:
  redis:
    container_name: redis
    build:
      context: .
      dockerfile: redis/Dockerfile
      no_cache: true
    expose: 
     - 6379
    profiles: [redis, bonus]
    networks:
      - back-tier
  ftp:
    container_name: ftp
    build:
      context: .
      dockerfile: ftp/Dockerfile
      args:
        CONF_VSFTPD: ${CONF_VSFTPD}
        TOOL_VSFTPD: ${TOOL_VSFTPD}
      no_cache: true
      secrets:
        - ftp_secret
    restart: always
    ports:
      - "21:21"
      - "42000-42010:42000-42010"
    expose:
      - 21
      - "42000-42010"
    profiles: [ftp, bonus]
    networks:
      - back-tier
    volumes:
      - wp:/opt/wordpress/

  web:
    container_name: web
    build:
      context: .
      dockerfile: web/Dockerfile
      no_cache: true
      args:
        DIR_WEB: ${DIR_WEB}
    profiles: [web, bonus]
    networks:
      - back-tier
    volumes:
      - web:/var/www

  adminer:
    container_name: adminer
    build:
      context:  .
      dockerfile: adminer/Dockerfile
      no_cache: true
      args:
        VS: ${VS}
    expose:
      - 8080
    restart:  always
    profiles: [adminer, bonus]
    networks:
      - back-tier

  uptime:
    container_name: uptime
    build:
      context:  .
      dockerfile: uptime/Dockerfile
      no_cache: true
    ports:
      - 3001:3001
    expose:
      - 3001
    profiles: [uptime, bonus]
    networks:
      - back-tier

secrets:
  ftp_secret:
    environment: "PASS_FTP"

volumes:
  web:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WEB_DIR}
