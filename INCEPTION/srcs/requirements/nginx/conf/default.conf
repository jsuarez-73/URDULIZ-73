server {
	listen  443 ssl;
	#Allowing only TLSv1.2, compulsory from subject.
	ssl_protocols   TLSv1.2 TLSv1.3;
	root			/opt/wordpress;

	location / {
		fastcgi_pass    wordpress:9000;
		include			/etc/nginx/fastcgi.conf;
		fastcgi_index   index.php;
	}

	location ~ /browser/ {
		root	/opt/nginx/web/;
		index	index.html;
	}

	location ~ \.(jpg|gif|png|webp|css|js|woff2)$ {
		root    /opt/nginx/wp/;
	}
	
	location ~* \.php$  {
		fastcgi_pass    wordpress:9000;
		include         /etc/nginx/fastcgi.conf;
	}

	error_page      500 502 503 504 /50x.html;
	location = /50x.html {
		root    /usr/share/nginx/html;
	}
}
